<!DOCTYPE html>
<html>

<head>

    <title>Aptitude Test</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>🧠 Aptitude Test</h1>

    <p>Answer all questions carefully.</p>

    <form method="POST">

        {% for question in questions %}

        <div class="question">

            <h3>
                {{ loop.index }}. {{ question.question }}
            </h3>

            {% for option in question.options %}

            <label>

                <input
                    type="radio"
                    name="question_{{ loop.index0 }}"
                    value="{{ option }}"
                    required
                >

                {{ option }}

            </label>

            <br>

            {% endfor %}

        </div>

        <hr>

        {% endfor %}

        <button type="submit">
            Submit Test
        </button>

    </form>

</div>

</body>

</html>
